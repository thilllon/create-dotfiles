name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ['ubuntu-latest']
    env:
      # Git hooks are for developers; CI runs the same checks as explicit steps.
      LEFTHOOK: 0
    strategy:
      matrix:
        # Node 20 is EOL and excluded by tsdown 0.22, release-it 21 and pnpm 11.
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
        env:
          MISE_NODE_VERSION: ${{ matrix.node-version }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
