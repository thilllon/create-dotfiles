name: Dependabot auto-merge

# Merges Dependabot's grouped minor/patch PRs once CI has passed on them. Majors arrive as
# separate PRs (see .github/dependabot.yml) and wait for a human.
#
# workflow_run, not pull_request: it runs after CI and has the repository's Actions secrets, which
# a Dependabot pull_request run does not. The merge uses RELEASE_TOKEN because a merge made with
# GITHUB_TOKEN starts no workflows, and the push to main must start release.yml, which writes the
# patch changeset for the update and releases it.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # The REST merge needs only Contents: write on RELEASE_TOKEN. `sha` makes it merge only the
      # commit CI passed on, never a newer push. The repository deletes merged branches itself.
      - run: |
          PR=$(gh api "repos/$GH_REPO/pulls?state=open&head=${GH_REPO%%/*}:$BRANCH" \
            --jq '.[] | select(.title | test("the [a-z-]+-minor-patch group")) | .number')
          if [ -z "$PR" ]; then
            echo "$BRANCH is not an open grouped minor/patch PR; left for review."
            exit 0
          fi
          gh api --method PUT "repos/$GH_REPO/pulls/$PR/merge" \
            -f merge_method=squash -f sha="$SHA" --jq .message
