name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ['ubuntu-latest']
    permissions:
      contents: write
      # Required for npm Trusted Publishing (OIDC): npm exchanges this short-lived
      # token for publish rights, so no NPM_TOKEN secret is needed. The package must
      # also be registered on npmjs.com with this repository and workflow as a
      # trusted publisher, otherwise `npm publish` is rejected.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v3
        with:
          cache: true
      # Trusted Publishing needs npm >= 11.5.1; the npm bundled with the pinned Node
      # already satisfies that. Printed so a publish failure is easy to diagnose.
      # Do not add `npm install -g npm@latest` here: npm 12 requires a newer Node than
      # mise.toml pins, so it fails with EBADENGINE.
      - run: npm --version
      - run: pnpm install --frozen-lockfile
      # release-it commits the version bump and tags it; the runner has no git identity
      # by default, so without this the run dies at "Author identity unknown" AFTER
      # npm publish has already succeeded, leaving npm ahead of git.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release --ci
