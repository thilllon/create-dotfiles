# npm Trusted Publishing is registered for this workflow filename, and the Homebrew tap's
# provenance check pins it (SOURCE_WORKFLOW in thilllon/homebrew-tap's bump.yml). Never rename or
# move this file, and publish only from here.
name: Release

# Every push to main runs this. What it does depends on the state of that commit:
#   - package.json's version is not on npm yet  -> publish it (the run for a release commit)
#   - pending changesets in .changeset/          -> `changeset version`, push chore(release): v<x>
#   - neither                                    -> nothing (docs, CI and tooling merges)
# The release commit is pushed with RELEASE_TOKEN, so it starts a run of its own, which publishes
# exactly that commit. workflow_dispatch reruns the same decision, e.g. after a failed publish.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Runs queue instead of racing for the same version. GitHub keeps one pending run per group and
# cancels an older pending one; that is safe, because the newer commit contains the older one and
# the decision above is made from the state of the commit, not from the event.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    # A dispatch from another branch must never publish that branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # The release commit is made here; the hooks would reformat it and rerun the test suite.
      LEFTHOOK: 0
    permissions:
      contents: write
      # Required for npm Trusted Publishing (OIDC): npm exchanges this short-lived token for
      # publish rights and signs provenance, so there is no NPM_TOKEN secret.
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      # main is protected and GITHUB_TOKEN can never push to it (GH006), so the release commit and
      # the tag are pushed with RELEASE_TOKEN: a fine-grained personal access token of a repository
      # admin, scoped to this repository with Contents: Read and write. A push made with it, unlike
      # one made with GITHUB_TOKEN, starts workflows, which is what publishes the release commit.
      - name: Check RELEASE_TOKEN
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set. Create a fine-grained personal access token for a repository admin (this repository only, Contents: Read and write, Metadata: Read) and add it as a repository secret named RELEASE_TOKEN under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Decide what this commit needs
        id: decide
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if [ -z "$(npm view "create-dotfiles@$VERSION" version 2>/dev/null)" ]; then
            echo "create-dotfiles@$VERSION is not on npm yet: publishing it."
            echo "mode=publish" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main has moved past $GITHUB_SHA; the run for the newer commit versions it."
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Dependabot cannot write changesets. Every dependency here is bundled into dist/, so an
          # npm update merged from Dependabot is released as a patch on its behalf.
          if [ "$(git log -1 --format=%an)" = "dependabot[bot]" ] &&
            ! git diff --quiet HEAD^ HEAD -- package.json pnpm-lock.yaml; then
            SUBJECT=$(git log -1 --format=%s)
            printf -- '---\n"create-dotfiles": patch\n---\n\n%s\n' "$SUBJECT" \
              > ".changeset/dependabot-$(git rev-parse --short HEAD).md"
            echo "Wrote a patch changeset for: $SUBJECT"
          fi
          if [ -n "$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md -print -quit)" ]; then
            echo "Pending changesets: versioning."
            echo "mode=version" >> "$GITHUB_OUTPUT"
          else
            echo "create-dotfiles@$VERSION is published and nothing is pending: nothing to release."
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      # Bumps package.json and writes CHANGELOG.md from the changesets, which it deletes. The
      # pushed commit starts the run that publishes it.
      - name: Version
        if: steps.decide.outputs.mode == 'version'
        run: |
          pnpm exec changeset version
          pnpm format
          VERSION=$(node -p 'require("./package.json").version')
          git add --all
          git commit --message "chore(release): v$VERSION"
          git push origin HEAD:main

      - name: Check
        if: steps.decide.outputs.mode == 'publish'
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      # Publishes every version not yet on npm (this package's, here) and tags it v<version>.
      - name: Publish
        id: publish
        if: steps.decide.outputs.mode == 'publish'
        run: |
          pnpm exec changeset publish
          git push origin --tags
          echo "published=true" >> "$GITHUB_OUTPUT"

  # Homebrew follows npm on its own: bump.yml in thilllon/homebrew-tap polls npm on a schedule
  # and commits each new version. GitHub disables a public repository's scheduled workflows after
  # 60 days without activity. The tap's bump commits count as activity, so that only happens after
  # a long gap between releases, and then this release would silently never reach Homebrew. This
  # job fails and opens an issue that mentions the owner, because a failed run alone may notify
  # nobody. It runs after the release job, so it cannot affect what was published.
  homebrew:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check that the Homebrew tap will pick this release up
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Homebrew tap: bump.yml is not active"
        run: |
          STATE=$(gh api repos/thilllon/homebrew-tap/actions/workflows/bump.yml --jq .state) || STATE="unreadable (see the error above)"
          if [ "$STATE" = "active" ]; then
            echo "bump.yml in thilllon/homebrew-tap is active; it will pick this release up within three hours."
            exit 0
          fi
          MSG="Homebrew will not pick up this release: bump.yml in thilllon/homebrew-tap is $STATE. Run: gh workflow enable bump.yml -R thilllon/homebrew-tap && gh workflow run bump.yml -R thilllon/homebrew-tap"
          echo "::error::$MSG"
          OPEN=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -z "$OPEN" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body "@$GITHUB_REPOSITORY_OWNER $MSG (release run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          fi
          exit 1
