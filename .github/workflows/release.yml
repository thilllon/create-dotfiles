name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish. Default: latest on npm + one patch."
        required: false
        type: string

# Queue concurrent releases instead of running them in parallel. Two runs started from
# the same main would both bump to the same version; the second would then fail at
# npm publish. This matters once dependabot-auto-release.yml dispatches releases.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ['ubuntu-latest']
    env:
      # release-it commits and pushes; without this the pre-commit hook would reformat
      # mid-release and pre-push would rerun the whole test suite.
      LEFTHOOK: 0
    permissions:
      contents: write
      # Required for npm Trusted Publishing (OIDC): npm exchanges this short-lived
      # token for publish rights, so no NPM_TOKEN secret is needed. The package must
      # also be registered on npmjs.com with this repository and workflow as a
      # trusted publisher, otherwise `npm publish` is rejected.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          cache: true
      # Trusted Publishing needs npm >= 11.5.1; the npm bundled with the Node pinned in
      # mise.toml satisfies that. Printed so a publish failure is easy to diagnose.
      # There is no reason to upgrade npm here; an earlier `npm install -g npm@latest`
      # step broke the release on an engines mismatch.
      - run: npm --version
      - run: pnpm install --frozen-lockfile
      # release-it commits the version bump and tags it; the runner has no git identity
      # by default, so without this the run dies at "Author identity unknown" AFTER
      # npm publish has already succeeded, leaving npm ahead of git.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # main is a protected branch that GITHUB_TOKEN cannot push to (GH006), so the
      # version bump is never committed: npm is the source of truth for the version.
      # The next version is latest-on-npm + one patch unless given explicitly;
      # release-it rewrites package.json before building, publishes, and pushes only
      # the tag, which the token is allowed to do. The version field on main is
      # therefore informational.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED: ${{ inputs.version }}
        run: |
          LATEST=$(npm view create-dotfiles version)
          if [ -n "$REQUESTED" ]; then
            NEXT="$REQUESTED"
          else
            NEXT=$(node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); console.log(`${a}.${b}.${c+1}`)' "$LATEST")
          fi
          echo "npm has $LATEST; releasing $NEXT"
          pnpm release --ci "$NEXT"
