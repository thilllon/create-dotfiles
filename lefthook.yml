# Installed into .git/hooks by the `prepare` script on `pnpm install`.
# Hooks are disabled in CI and in the release job via LEFTHOOK=0.

pre-commit:
  parallel: true
  commands:
    format:
      run: pnpm format
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
    build:
      run: pnpm build
