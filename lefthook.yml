# Installed into .git/hooks by the `prepare` script on `pnpm install`.
# Hooks are disabled in CI and in the release job via LEFTHOOK=0.

pre-commit:
  parallel: true
  commands:
    format:
      run: pnpm format
      stage_fixed: true
    # gitleaks comes from mise.toml (`mise install`). CI scans the tree too, so a commit made
    # with --no-verify is still caught before it can merge.
    secrets:
      run: gitleaks git --pre-commit --staged --redact --no-banner

pre-push:
  parallel: true
  commands:
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
    build:
      run: pnpm build
